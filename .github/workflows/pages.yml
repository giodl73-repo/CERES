name: Production workbench
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    # Playwright 1.58.2 does not support Ubuntu 26.04 (ubuntu-latest).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install tools
        run: |
          rustup show
          cargo install wasm-bindgen-cli --version 0.2.127 --locked
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify and restore locked Cargo inputs
        run: |
          python tests/input_custody.py
          input_sha=$(cut -d' ' -f1 cargo-inputs/sha256.txt)
          python tools/input-custody.py --sha256 "$input_sha" --inputs "$RUNNER_TEMP/ceres-inputs" --cargo-home "$RUNNER_TEMP/ceres-cargo-home"
          echo "CARGO_HOME=$RUNNER_TEMP/ceres-cargo-home" >> "$GITHUB_ENV"
          echo "CARGO_NET_OFFLINE=true" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
      - name: Validate Rust
        run: |
          cargo fmt --all --check
          cargo test --locked --offline --workspace --all-targets
          cargo clippy --locked --offline --no-deps --workspace --all-targets --all-features -- -D warnings
      - name: Build Pages and test browser
        run: |
          python tools/build-pages.py
          python tests/source_custody.py
          cargo build --locked --offline -p ceres-web --example reader-control
          node tools/check-reader.mjs dist/CERES/pkg/ceres_web.js target/debug/examples/reader-control reader-parity.json
          npm test
      - uses: actions/upload-artifact@v4
        with:
          name: reader-parity
          path: reader-parity.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/CERES
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
